---
# .github/workflows/docker-build-on-tag.yml
name: Docker Image CI on Tag

on:
  push:
    branches:
      - rolling
    tags:
      - 'v*.*.*' # Trigger on tags like v1.0.0, v1.2.3, etc.

jobs:
  build_and_push_docker_image:
    runs-on: ubuntu-latest
    environment: build
    permissions:
      contents: read
      packages: write # Required if pushing to GitHub Packages
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata (tags, labels) for Branch
        id: meta_branch
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            # Use the branch name as a Docker tag (e.g., 'main' or 'develop')
            type=raw,value=${{ github.ref_name }}
            # Also tag with 'latest' if on the 'main' branch
            type=raw,value=latest,enable=${{ github.ref_name == 'rolling' }}
            # Optionally, tag with the short commit SHA for traceability
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.branch=${{ github.ref_name }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Path to your Dockerfile's context (usually the root of the repo)
          push: true
          tags: ${{ steps.meta_brnach.outputs.tags }}
          labels: ${{ steps.meta_brnach.outputs.labels }}
          cache-from: type=gha # Cache layers using GitHub Actions cache
          cache-to: type=gha,mode=max # Store cache layers

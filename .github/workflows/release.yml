name: Bump release version
on:
  pull_request:
    branches: [rolling]
    types:
      - closed

permissions:
  contents: write
  pull-requests: write
  repository-projects: write

concurrency: production

jobs:
  build:
    name: bump tag version and release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version-bump.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Clean invalid tags and ensure initial tag exists
        run: |
          # Fetch remote tag list and prevent non-SemVer tags from being fetched
          git ls-remote --tags origin | awk '{print $2}' | sed 's|^refs/tags/||' | grep -v '\^{}' | while read -r tag; do
            if ! echo "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              # Attempt to delete the invalid tag on the remote repository via GitHub API and git push
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" 2>/dev/null || true
              git push origin ":refs/tags/$tag" 2>/dev/null || true
              # Configure negative refspec so git fetch --tags in subsequent actions will not fetch it
              git config --add remote.origin.fetch "^refs/tags/$tag"
              # Delete invalid tag locally if already present
              git tag -d "$tag" 2>/dev/null || true
            fi
          done
          git fetch --tags
          # Delete any remaining local tags that do not conform strictly to anchored SemVer format
          git tag -l | while read -r t; do
            if ! echo "$t" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              git tag -d "$t" 2>/dev/null || true
            fi
          done
          if ! git tag -l | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            git tag v0.0.0
            git push origin v0.0.0 || true
          fi
        env:
          GH_TOKEN: ${{ secrets.ADMIN_RIGHTS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Bump version and push tag
        id: version-bump
        uses: hennejg/github-tag-action@v4.4.0
        with:
          github_token: ${{ secrets.ADMIN_RIGHTS_TOKEN || secrets.GITHUB_TOKEN }}
          release_branches: rolling
      - name: create branch
        uses: peterjgrainger/action-create-branch@v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_RIGHTS_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          branch: update-from-${{ github.sha }}
      - name: update cargo.toml
        run: |
          appversion=$(echo "${{ steps.version-bump.outputs.new_tag }}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          sed -i -e "s/^version = .*/version = \"$appversion\"/" Cargo.toml
      - run: rustup toolchain install stable --profile minimal
      - run: rustup update stable && rustup default stable
      - name: regenerate cargo.lock
        run: cargo generate-lockfile
      - name: auto commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[skip ci] updating app version to ${{ steps.version-bump.outputs.new_tag }}"
          branch: update-from-${{ github.sha }}
      # create PR using GitHub CLI
      - name: create PR with update info
        id: create-pr
        run: |
          gh pr create --base rolling --head update-from-${{ github.sha }} --title 'Merge new update into rolling' --body 'Created by Github action' || {
            echo "::warning::Unable to create update PR with the current token. Ensure ADMIN_RIGHTS_TOKEN is provided or 'Allow GitHub Actions to create and approve pull requests' is enabled in repository settings."
          }
        env:
          GH_TOKEN: ${{ secrets.ADMIN_RIGHTS_TOKEN || secrets.GITHUB_TOKEN }}
      # merge PR using GitHub CLI
      - name: merge PR with update info
        id: merge-pr
        run: |
          gh pr merge --admin --merge --subject 'Merge update info' --delete-branch || \
          gh pr merge --merge --subject 'Merge update info' --delete-branch || {
            echo "::warning::Unable to merge update PR. Ensure token has PR merge permissions or branch protection permits action merge."
          }
        env:
          GH_TOKEN: ${{ secrets.ADMIN_RIGHTS_TOKEN || secrets.GITHUB_TOKEN }}
  build-linux:
    name: build linux binaries
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-amd64
          - os: ubuntu-24.04-arm
            asset_suffix: linux-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build Linux release binary
        run: cargo build --release
      - name: Package Linux artifact
        run: |
          mkdir -p dist staging/websurfx staging/websurfx/public
          cp target/release/websurfx dist/websurfx-${{ matrix.asset_suffix }}
          chmod +x dist/websurfx-${{ matrix.asset_suffix }}
          sha256sum dist/websurfx-${{ matrix.asset_suffix }} > dist/websurfx-${{ matrix.asset_suffix }}.sha256
          cp -r websurfx/* staging/websurfx/
          cp -r public/* staging/websurfx/public/
          cp target/release/websurfx staging/websurfx-${{ matrix.asset_suffix }}
          chmod +x staging/websurfx-${{ matrix.asset_suffix }}
          tar -czf dist/websurfx-${{ matrix.asset_suffix }}.tar.gz -C staging .
          sha256sum dist/websurfx-${{ matrix.asset_suffix }}.tar.gz > dist/websurfx-${{ matrix.asset_suffix }}.tar.gz.sha256
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: websurfx-${{ matrix.asset_suffix }}
          path: dist/*
          retention-days: 1

  publish-release:
    name: publish release assets
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.ADMIN_RIGHTS_TOKEN || secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          name: ${{ needs.build.outputs.release_tag }}
          tag_name: ${{ needs.build.outputs.release_tag }}
          prerelease: false
          files: |
            websurfx-*/*
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

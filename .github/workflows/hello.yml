---
name: Welcome first time contributors 

on:
  pull_request_target:
    types:
      - opened
 
jobs:
  welcome:
    name: Welcome
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          pr_message: |-
            Congrats on making your first Pull Request and thanks for taking the time to improve Websurfx! ❤️!
            Say hello by joining the conversation in our [Discord](https://discord.gg/SWnda7Mw5u)
          issue_message: |-
            Thanks for opening your first issue and thanks for taking the time to improve Websurfx! ❤️!
            Say hello by joining the conversation in our [Discord](https://discord.gg/SWnda7Mw5u)
